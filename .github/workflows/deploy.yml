name: Deploy to VPS

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js (if you're using Node.js)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          # Navigate to your web directory
          cd /var/www/rsweeting/frontend
          
          # Pull latest changes
          git pull origin production
          
          # Install dependencies and build frontend
          npm ci
          npm run build

          # Verify backend structure exists
          echo "Verifying backend structure..."
          ls -la routes/ services/ server.js || echo "Warning: Some backend files missing"
          
          # Verify environment variables
          if [ ! -f .env.server ]; then
            echo "ERROR: .env.server not found! Backend will not work properly."
          fi

          # Restart Node.js backend with modular routes
          # Start or reload the specific backend process
          pm2 describe lifeflow-backend > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "Reloading existing backend process..."
            pm2 reload lifeflow-backend
          else
            echo "Starting backend for the first time..."
            pm2 start ecosystem.config.cjs
          fi
          pm2 save